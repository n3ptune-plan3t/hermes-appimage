name: Build Hermes-Web-AppImage (backend-only, low-RAM)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths:
      - make-appimage.sh
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@v2

      - name: Stage 1 - install deps, build the app
        env:
          ARCH: ${{ matrix.arch }}
        run: /bin/sh ./get-dependencies.sh

      - name: Stage 2 - package as AppImage
        env:
          ARCH: ${{ matrix.arch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: /bin/sh ./make-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Web-${{ matrix.arch }}
          path: dist

      - name: Publish release
        if: github.event_name != 'push'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: continuous
          prerelease: true
          files: dist/*
